name: Actualizare Playlist M3U

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Genereaza M3U
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python update_playlist.py
      - name: Salveaza modificari
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add playlist.m3u
          git diff --quiet && git diff --staged --quiet || git commit -m "Actualizare automata playlist"
          git push
